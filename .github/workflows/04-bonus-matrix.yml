# ============================================================
#  BONUS EXERCISE — Matrix Builds  (~20 min)
# ============================================================
#
# ΣΤΟΧΟΣ: Να τρέχουν τα tests παράλληλα σε πολλαπλές
#         εκδόσεις Python — αυτόματα!
#
# ΤΙ ΘΑ ΜΑΘΕΙΣ:
#   - matrix strategy
#   - Πώς να παραλληλοποιείς jobs
#   - fail-fast: να σταματάνε όλα αν ένα αποτύχει
#
# ============================================================

name: "BONUS — Matrix Builds"

on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # Επιτρέπει manual trigger από το GitHub UI

jobs:

  test-matrix:
    name: "Test on Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # αν αποτύχει μια version, συνέχισε τις άλλες
      matrix:
        # TODO 1: Πρόσθεσε versions: ["3.10", "3.11", "3.12"]
        python-version:
          # --- ΓΡΑΨΕ ΕΔΩ ---

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: "testing"
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          echo "Testing on Python $PYTHON_VERSION"
          pytest app/tests/ -v

      - name: Report
        if: always()
        run: |
          echo "Python ${{ matrix.python-version }}: ${{ job.status }}"


