      #           context: ./app        ← ο φάκελος με το Dockerfile
      #           push: true
      #           tags: <το full image name από το output>
      #
      # --- ΓΡΑΨΕ ΕΔΩ ---


  # ── Job 2: Pull & Run ─────────────────────────────────────────────────
  pull-and-run:
    name: "Pull from DockerHub & Run"
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull image from DockerHub
        # TODO 4: Κάνε pull το image που μόλις push-αρες
        #         docker pull <το full image name>
        #         Hint: χρησιμοποίησε το needs.build-and-push.outputs.image_full
        run: |
          # --- ΓΡΑΨΕ ΕΔΩ ---

      # TODO 5: Τρέξε το container με τα παρακάτω:
      #   - detached mode (-d)
      #   - port mapping: 8080:5000
      #   - env variables: ENVIRONMENT και APP_VERSION
      #   - name: workshop-app
      #
      - name: Run container
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_full }}
          TAG:   ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # --- ΓΡΑΨΕ ΕΔΩ ---
          # docker run -d \
          #   -p ???:??? \
          #   -e ENVIRONMENT=??? \
          #   -e APP_VERSION="3.0.0" \
          #   --name workshop-app \
          #   $IMAGE

      - name: Wait for container to start
        run: sleep 3

      # TODO 6: Κάνε health check — κάλεσε το /health endpoint
      #         curl -f http://localhost:8080/health
      #         Αν επιστρέψει error, το pipeline πρέπει να αποτύχει (exit code ≠ 0)
      #
      - name: Health check
        run: |
          # --- ΓΡΑΨΕ ΕΔΩ ---

      - name: Test API response
        run: |
          echo "Testing main endpoint..."
          curl -s http://localhost:8080/ | python3 -m json.tool
          echo ""
          echo "Testing info endpoint..."
          curl -s http://localhost:8080/info | python3 -m json.tool

      - name: Show container logs
        if: always()
        run: docker logs workshop-app

      - name: Stop and remove container
        if: always()
        run: docker rm -f workshop-app || true


