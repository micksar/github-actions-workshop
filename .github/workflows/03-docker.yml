      # Hint: Χρησιμοποίησε το $GITHUB_OUTPUT για να βγάλεις outputs:
      #   echo "tag=latest" >> $GITHUB_OUTPUT
      #   echo "full=${{ secrets.DOCKERHUB_USERNAME }}/workshop-app:latest" >> $GITHUB_OUTPUT
      #
      - name: Set image tag
        id: set-tag
        run: |
          # --- ΓΡΑΨΕ ΕΔΩ ---
          # if [ "${{ github.ref_name }}" == "???" ]; then
          #   echo "tag=???" >> $GITHUB_OUTPUT
          #   echo "full=???" >> $GITHUB_OUTPUT
          # else
          #   ...
          # fi

      - name: Show image info
        run: |
          echo "Branch:     ${{ github.ref_name }}"
          echo "Tag:        ${{ steps.set-tag.outputs.tag }}"
          echo "Full image: ${{ steps.set-tag.outputs.full }}"

      # TODO 2: Κάνε login στο DockerHub
      #         uses: docker/login-action@v3
      #         with: username και password από secrets
      #
      # --- ΓΡΑΨΕ ΕΔΩ ---

