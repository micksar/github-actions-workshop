# ============================================================
#  EXERCISE 3 — Docker Build, Push & Run  (~50 min)
# ============================================================
#
# ΣΤΟΧΟΣ: Να χτίζεις Docker image, να το ανεβάζεις στο DockerHub,
#         και να το κατεβάζεις ξανά για να τρέξεις τo container —
#         όλα αυτόματα μέσω GitHub Actions.
#
# TAG STRATEGY:
#   push σε develop  →  image tag:  <username>/workshop-app:develop
#   push σε main     →  image tag:  <username>/workshop-app:latest
#
# ΠΡΟΑΠΑΙΤΟΥΜΕΝΟ: Φτιάξε λογαριασμό στο DockerHub και πρόσθεσε secrets:
#   DOCKERHUB_USERNAME = το DockerHub username σου
#   DOCKERHUB_TOKEN    = DockerHub Access Token (Account Settings → Security)
#
# ============================================================

name: "Exercise 3 — Docker Build & Push"

on:
  push:
    branches: [main, develop]

jobs:

  # ── Job 1: Build & Push ───────────────────────────────────────────────
  build-and-push:
    name: "Build & Push to DockerHub"
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      image_full: ${{ steps.set-tag.outputs.full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO 1: Ορίσε το image tag ανάλογα με το branch
      #
      # Αν branch == main   → tag = "latest"
      # Αν branch == develop → tag = "develop"
