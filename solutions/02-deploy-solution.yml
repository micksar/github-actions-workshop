name: "Exercise 2 — Deploy by Branch (SOLUTION)"

on:
  push:
    branches:
      - develop
      - main

env:
  APP_VERSION: "2.0.0"

jobs:

  detect-env:
    name: "Detect Target Environment"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy_url:  ${{ steps.set-env.outputs.deploy_url }}
    steps:
      - name: Set environment based on branch
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "deploy_url=https://app.myfintech.com" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "deploy_url=https://staging.myfintech.com" >> $GITHUB_OUTPUT
          fi
      - run: |
          echo "Branch:      ${{ github.ref_name }}"
          echo "Environment: ${{ steps.set-env.outputs.environment }}"

  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    needs: detect-env
    if: github.ref_name == 'develop'
    environment:
      name: staging
      url: ${{ needs.detect-env.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        env:
          DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          ENVIRONMENT: staging
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  STAGING DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: $APP_VERSION"
          echo "Token (4 chars): ${DEPLOY_TOKEN:0:4}****"
          sleep 2
          echo "✅ Deployed to STAGING!"
      - name: Run smoke tests
        run: |
          echo "  ✓ Health check: OK"
          echo "  ✓ API response: OK"

  deploy-production:
    name: "Deploy → Production"
    runs-on: ubuntu-latest
    needs: detect-env
    if: github.ref_name == 'main'
    environment:
      name: production
      url: ${{ needs.detect-env.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pre-deployment check
        env:
          DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
        run: |
          echo "⚠️  PRODUCTION deployment! Version: ${{ env.APP_VERSION }}"
          echo "Token (4 chars): ${DEPLOY_TOKEN:0:4}****"
      - name: Deploy to Production
        env:
          DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
          ENVIRONMENT: production
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⚠️  PRODUCTION DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Token (4 chars): ${DEPLOY_TOKEN:0:4}****"
          sleep 3
          echo "✅ Deployed to PRODUCTION!"
      - name: Notify team
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          echo "Webhook URL: ${WEBHOOK_URL:0:20}..."
          echo "✅ Team notified!"
